x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: ${DATABASE_URL:?Set hosted DATABASE_URL in .env}
    REDIS_URL: ${REDIS_URL:?Set hosted REDIS_URL in .env}
    QDRANT_URL: ${QDRANT_URL:?Set hosted QDRANT_URL in .env}
    S3_BUCKET: ${S3_BUCKET:?Set hosted S3_BUCKET in .env}
    MEDIACHAIN_API_KEYS: ${MEDIACHAIN_API_KEYS:?Set MEDIACHAIN_API_KEYS in .env}
    MEDIACHAIN_REQUIRE_HOSTED_SERVICES: "true"
    MEDIACHAIN_DATA_DIR: /data
    MEDIACHAIN_FRONTEND_DIR: /app/frontend/dist
  volumes:
    - media:/data
    - models:/home/mediachain/.cache

services:
  api:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
  worker:
    <<: *app
    command: ["arq", "mediachain.runtime.server.WorkerSettings"]

volumes:
  media:
  models:
