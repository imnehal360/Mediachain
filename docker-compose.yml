x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql://mediachain:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres/mediachain
    REDIS_URL: redis://redis:6379/0
    QDRANT_URL: http://qdrant:6333
    MEDIACHAIN_DATA_DIR: /data
  volumes:
    - media:/data
    - models:/home/mediachain/.cache
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    qdrant:
      condition: service_started

services:
  api:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
  worker:
    <<: *app
    command: ["arq", "mediachain.runtime.server.WorkerSettings"]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mediachain
      POSTGRES_USER: mediachain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediachain"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  qdrant:
    image: qdrant/qdrant:v1.19.1
    volumes:
      - qdrant:/qdrant/storage

volumes:
  media:
  models:
  postgres:
  redis:
  qdrant:
