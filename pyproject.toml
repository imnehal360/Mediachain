[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "Mediachain"
version = "0.1.0"
description = "Composable, temporally grounded multimodal AI pipelines"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "imnehal360" }]
keywords = ["ai", "multimodal", "rag", "retrieval", "audio", "video"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Multimedia",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["pydantic>=2.9,<3"]

[project.urls]
Homepage = "https://github.com/imnehal360/Mediachain"
Documentation = "https://imnehal360.github.io/Mediachain/"
Repository = "https://github.com/imnehal360/Mediachain.git"
Issues = "https://github.com/imnehal360/Mediachain/issues"
Changelog = "https://github.com/imnehal360/Mediachain/blob/main/CHANGELOG.md"

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30", "python-multipart>=0.0.18"]
media = ["av>=13", "pillow>=10"]
pdf = ["pypdf>=5"]
speech = ["faster-whisper>=1.1"]
embeddings = ["sentence-transformers>=3"]
http = ["httpx>=0.27"]
huggingface = ["huggingface-hub>=0.27", "numpy>=1.26"]
server = ["asyncpg>=0.29", "qdrant-client>=1.12", "redis>=5", "arq>=0.26"]
cloud = ["boto3>=1.35"]
ocr = ["pymupdf>=1.25"]
youtube = ["yt-dlp[default]>=2025.1"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9", "mypy>=1.13", "httpx>=0.27", "fastapi>=0.115", "python-multipart>=0.0.18", "av>=13", "pillow>=10", "pypdf>=5", "qdrant-client>=1.12"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["services: requires PostgreSQL and Redis services"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".uv-cache", ".tools", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC240"]
"src/mediachain/api/app.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
follow_imports = "skip"
files = ["src/mediachain"]

[tool.hatch.build.targets.wheel]
packages = ["src/mediachain"]

[tool.hatch.build]
exclude = [".venv", ".uv-cache", ".tools", ".mediachain", ".env", "dist", "site"]
